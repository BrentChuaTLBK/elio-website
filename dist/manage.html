<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fefaef">
  <title>Kitchen dashboard · Elio Basque Cheesecake</title>
  <link rel="icon" href="assets/elio-favicon.png">
  <link rel="stylesheet" href="assets/admin/ordering.css?v=delivery-options-1">
  <link rel="stylesheet" href="assets/admin/manage.css?v=daily-quantities-1">
  <link rel="stylesheet" href="assets/admin/elio.css">
<link rel="stylesheet" href="assets/admin/catalog-order.css">

<body class="manage-page">
  <a class="skip-link" href="#workspace">Skip to dashboard</a>
  <header class="topbar admin-topbar">
    <a class="brand" href="index.html"><span class="elio-admin-wordmark" aria-hidden="true">ELIO</span><span>Elio Basque Cheesecake<small>Kitchen dashboard</small></span></a>
    <nav class="nav-links" aria-label="Quick links"><a href="order.html">View shop <span aria-hidden="true">↗</span></a><a href="admin-account.html" id="account-link">My account</a></nav>
  </header>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="sidebar-caption">YOUR KITCHEN</p>
      <nav aria-label="Dashboard sections" id="admin-nav">
        <button class="sidebar-link active" data-view="overview"><span aria-hidden="true">◫</span>Overview</button>
        <button class="sidebar-link" data-view="analytics"><span aria-hidden="true">▥</span>Analytics</button>
        <button class="sidebar-link" data-view="orders"><span aria-hidden="true">☷</span>Orders<span id="review-count" class="nav-count" hidden></span></button>
        <button class="sidebar-link" data-view="flavors"><span aria-hidden="true">▧</span>Flavors</button>
        <button class="sidebar-link" data-view="menus"><span aria-hidden="true">◇</span><span>Flavor menus</span></button>
        <button class="sidebar-link" data-view="boxes"><span aria-hidden="true">□</span>Boxes & sets</button>
        <button class="sidebar-link" data-view="inventory"><span aria-hidden="true">▦</span>Daily quantities</button>
        <button class="sidebar-link" data-view="production"><span aria-hidden="true">▤</span><span>Production</span></button>
        <button class="sidebar-link" data-view="promos"><span aria-hidden="true">◇</span>Promo codes</button>
        <button class="sidebar-link" data-view="newsletter"><span aria-hidden="true">✉</span>Newsletter</button>
        <button class="sidebar-link" data-view="faqs"><span aria-hidden="true">?</span>FAQs</button>
        <button class="sidebar-link" data-view="settings"><span aria-hidden="true">⚙</span>Shop settings</button>
        <button class="sidebar-link" data-view="team"><span aria-hidden="true">♧</span>Team access</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span id="shop-status">Checking connection</span><small>PHP · Asia/Manila</small></div>
    </aside>
    <main id="workspace" class="admin-workspace" tabindex="-1" aria-live="polite"><div class="empty-state"><p>Opening your kitchen dashboard…</p></div></main>
  </div>
  <dialog id="admin-dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><div class="dialog-top"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></div></dialog>
  <noscript><p class="notice">JavaScript is needed to manage your shop. Please enable it and reload.</p></noscript>
  <script src="content.js"></script>
  <script type="module" src="assets/admin/manage.js?v=elio-admin-1"></script>
