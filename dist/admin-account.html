<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Team sign in · Elio</title><link rel="icon" href="assets/elio-favicon.png"><link rel="stylesheet" href="assets/admin/ordering.css"><link rel="stylesheet" href="assets/admin/elio.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="elio-admin-wordmark">ELIO</span><span>Basque Cheesecake<small>Team access</small></span></a><a href="manage.html" style="color:inherit">Dashboard</a></header><main class="panel admin-account"><p class="eyebrow">Your kitchen, together</p><h1 id="account-heading">Sign in to Elio.</h1><p>Use your Elio account. Dashboard access is granted separately by an owner.</p><p id="account-status" role="status"></p><form id="account-form"><label class="field">Email address<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label class="field" id="password-field">Password<input type="password" name="password" autocomplete="current-password" required minlength="12"></label><div class="account-actions"><button class="button" type="submit" id="account-submit">Sign in</button><button class="button button-secondary" type="button" id="account-mode">Create an account</button><button class="button button-quiet" type="button" id="account-reset">Forgot password</button></div></form><div id="signed-in" hidden><a class="button" href="manage.html">Open dashboard</a> <button class="button button-secondary" id="account-signout">Sign out</button></div><p class="muted" style="margin-top:20px"><a href="admin-setup.html">First-time setup</a></p></main><script type="module" src="assets/admin/account.js"></script></body></html>
